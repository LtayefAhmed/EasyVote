# ===================================================================
# EasyVote Backend - Application Configuration
# ===================================================================

# Server
server.port=8082
spring.application.name=easyvote-backend

# Database (XAMPP MariaDB local, root sans password)
spring.datasource.url=jdbc:mysql://localhost:3306/easyvote_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect

# JWT (custom properties)
easyvote.jwt.secret=ChangeMeSuperSecretKeyForJwtSigningMustBeLongEnough256bitsForHS256Algorithm
easyvote.jwt.expiration=86400000
easyvote.jwt.refresh-expiration=604800000

# Mail (Mailtrap - placeholders à remplir plus tard)
spring.mail.host=sandbox.smtp.mailtrap.io
spring.mail.port=2525
spring.mail.username=ed809eb0452274
spring.mail.password=2ad83c8ba563ec
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# File upload
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# App
easyvote.app.name=EasyVote
easyvote.app.url=http://localhost:5173

# CORS - frontend local
easyvote.cors.allowed-origins=http://localhost:5173,http://localhost:3000

# Logging
logging.level.com.easyvote.backend=DEBUG
logging.level.org.springframework.security=INFO
